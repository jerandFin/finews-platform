name: FinNews Codex repair

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
  workflow_run:
    workflows: ["FinNews CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finnews-autofix
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Codex diagnosis and bounded repair
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: .github/codex/repair.md
          output-file: codex-report.md

      - name: Exclude agent report from proposed source changes
        run: rm -f codex-report.md

      - name: Reject changes to automation and security control files
        shell: bash
        run: |
          changed="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )"
          printf 'Modified files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^\.github/|^AGENTS\.md$|^package-lock\.json$'; then
            echo 'Codex attempted to change protected configuration; refusing to create PR.'
            exit 1
          fi

      - name: Open draft repair pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: codex/automated-repairs
          delete-branch: true
          draft: true
          title: "chore: Codex-proposed FinNews repairs"
          commit-message: "chore: propose bounded Codex repairs"
          body: |
            Automated Codex repair proposal. No deployment or auto-merge is enabled.
            Review the changed files, CI evidence, security implications and any
            behaviour changes. A human must explicitly approve and merge.
            If no changes were needed, this workflow creates no pull request.
