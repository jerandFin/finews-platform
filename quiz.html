<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Mastery Quiz — FinNews</title>
    <link rel="stylesheet" href="/public/css/styles.css">
    <style>
        .quiz-container { max-width: 800px; margin: 40px auto; padding: 20px; font-family: 'Inter', sans-serif; }
        .quiz-card { background: #ffffff; border: 1px solid #e2e8f0; padding: 24px; margin: 20px 0; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .quiz-question { font-size: 1.1rem; color: #1a202c; margin-bottom: 16px; font-weight: 600; }
        .opt-btn { display: block; width: 100%; padding: 12px 16px; margin: 8px 0; cursor: pointer; text-align: left; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; transition: all 0.2s ease; color: #334155; }
        .opt-btn:hover:not(:disabled) { background: #f1f5f9; border-color: #94a3b8; }
        
        /* Difficulty Interface Settings */
        .controls-row { display: flex; gap: 16px; align-items: center; margin-bottom: 24px; background: #f1f5f9; padding: 16px; border-radius: 8px; }
        .selector-label { font-weight: 600; color: #1e293b; font-size: 0.95rem; }
        .difficulty-select { padding: 10px 16px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; font-weight: 500; font-size: 0.95rem; color: #334155; outline: none; cursor: pointer; }
        
        .gen-btn { background: #1e3a8a; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: background 0.2s; }
        .gen-btn:hover { background: #172554; }
        .nav-back { display: inline-block; margin-bottom: 20px; color: #1e3a8a; text-decoration: none; font-weight: 500; }
        .correct-choice { background: #d4edda !important; border-color: #c3e6cb !important; color: #155724 !important; font-weight: 600; }
        .incorrect-choice { background: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24 !important; }
    </style>
</head>
<body>

    <div class="quiz-container">
        <a href="/" class="nav-back">← Back to Financial Headlines</a>
        <h1>Macroeconomic Reasoning Pool</h1>
        <p style="color: #64748b; margin-bottom: 24px;">Configure structural parameters to evaluate distinct dynamic system responses.</p>
        
        <div class="controls-row">
            <span class="selector-label">Target Assessment Level:</span>
            <select id="difficulty-level" class="difficulty-select">
                <option value="easy">Easy (Micro & Basic Concepts)</option>
                <option value="medium" selected>Medium (Macroeconomic Structures)</option>
                <option value="hard">Hard (Quantitative & Interbank Contagion)</option>
            </select>
            <button id="gen-btn" class="gen-btn">Generate Fresh Quiz Batch</button>
        </div>

        <p id="quiz-status" role="status"></p>
        <div id="quiz-wrapper"></div>
    </div>

    <script>
        const btn = document.getElementById('gen-btn');
        const wrapper = document.getElementById('quiz-wrapper');
        const difficultySelector = document.getElementById('difficulty-level');
        const quizStatus = document.getElementById('quiz-status');
        const recentByLevel = new Map();

        btn.addEventListener('click', async (e) => {
            e.preventDefault();
            
            const level = difficultySelector.value;
            btn.disabled = true;
            difficultySelector.disabled = true;
            quizStatus.textContent = "Loading questions…";
            
            try {
                const recentQuestions = recentByLevel.get(level) || [];
                const res = await fetch(`/api/quiz?difficulty=${level}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ recentQuestions })
                });
                if (!res.ok) throw new Error("Quiz request failed");

                const data = await res.json();
                const currentQuestions = data.map(item => item.question);
                recentByLevel.set(level, [
                    ...recentQuestions.filter(question => !currentQuestions.includes(question)),
                    ...currentQuestions
                ].slice(-9));
                wrapper.replaceChildren();
                quizStatus.textContent = res.headers.get('X-Quiz-Source') === 'practice'
                    ? "Practice questions"
                    : "News-based questions";

                data.forEach((q, i) => {
                    const card = document.createElement('div');
                    card.className = 'quiz-card';
                    
                    const questionText = document.createElement('p');
                    questionText.className = 'quiz-question';
                    const questionLabel = document.createElement('strong');
                    questionLabel.textContent = `Q${i + 1} [${level.toUpperCase()}]: `;
                    questionText.append(questionLabel, q.question);
                    card.appendChild(questionText);

                    q.options.forEach(opt => {
                        const optBtn = document.createElement('button');
                        optBtn.className = 'opt-btn';
                        optBtn.textContent = opt;

                        optBtn.addEventListener('click', (event) => {
                            event.preventDefault();
                            
                            const siblingButtons = card.querySelectorAll('.opt-btn');
                            siblingButtons.forEach(b => b.disabled = true);

                            if (opt === q.correctAnswer) {
                                optBtn.classList.add('correct-choice');
                                optBtn.textContent += " ✓ Correct Answer";
                            } else {
                                optBtn.classList.add('incorrect-choice');
                                optBtn.textContent += " ✕ Incorrect";

                                siblingButtons.forEach(b => {
                                    if (b.textContent === q.correctAnswer) {
                                        b.classList.add('correct-choice');
                                    }
                                });
                            }
                        });
                        card.appendChild(optBtn);
                    });

                    wrapper.appendChild(card);
                });
            } catch {
                quizStatus.textContent = "Unable to load questions. Please try again.";
            } finally {
                btn.disabled = false;
                difficultySelector.disabled = false;
            }
        });
    </script>
</body>
</html>
